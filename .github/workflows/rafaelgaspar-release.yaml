name: rafaelgaspar Release

on:
  push:
    branches:
      - rafaelgaspar
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to publish (branch tip after tag-bump)
        type: string
        required: false
        default: rafaelgaspar
      upstream_tag:
        description: Upstream tag the stack was rebuilt onto
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  release:
    name: Tag, build deb, publish release
    if: github.repository == 'rafaelgaspar/xpra'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Caller event_name is schedule/workflow_dispatch, not workflow_call.
          ref: ${{ inputs.ref || github.sha }}

      - name: Checkout fork-pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rafaelgaspar/fork-pack
          ref: main
          path: .fork-pack

      - name: Configure git
        run: |
          git config user.name "Rafael Antunes"
          git config user.email "me@rafaelgaspar.xyz"

      - name: Fetch upstream tags
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Xpra-org/xpra.git
          else
            git remote add upstream https://github.com/Xpra-org/xpra.git
          fi
          git fetch --tags upstream

      - name: Resolve integration tag
        id: release
        env:
          UPSTREAM_TAG_INPUT: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          integration_base="${UPSTREAM_TAG_INPUT}"
          if [[ -z "${integration_base}" ]]; then
            git fetch upstream v7.x:v7.x
            merge=$(git merge-base HEAD upstream/v7.x)
            short=$(git rev-parse --short=7 "${merge}")
            ver=$(git show "${merge}:xpra/__init__.py" | sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' | head -1)
            integration_base="v${ver}-${short}"
          fi
          chmod +x .fork-pack/scripts/resolve-integration-tag.sh
          .fork-pack/scripts/resolve-integration-tag.sh 'v*.*.*' '^v[0-9]+\.[0-9]+\.[0-9]+$' "${integration_base}"
          integration_version=$(grep '^integration_version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          base_tag=$(grep '^base_tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          pkg_ver=$(grep '^package_upstream_version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          echo "deb_version=${integration_version}" >> "$GITHUB_OUTPUT"
          echo "xpra_upstream_version=${pkg_ver:-${base_tag#v}}" >> "$GITHUB_OUTPUT"

      - name: Checkout xpra-html5 fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rafaelgaspar/xpra-html5
          ref: rafaelgaspar
          path: xpra-html5-src
          fetch-depth: 0
          fetch-tags: true

      - name: Download xpra-html5 release tarball
        id: html5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          html5_tag=$(gh release list --repo rafaelgaspar/xpra-html5 --limit 30 --json tagName \
            -q '[.[].tagName | select(contains("rafaelgaspar."))] | sort | last // empty')
          [[ -n "${html5_tag}" ]] || { echo "No rafaelgaspar xpra-html5 release found"; exit 1; }
          base_tag="${html5_tag%-rafaelgaspar.*}"
          if [[ "${base_tag}" =~ ^v[0-9]+$ ]]; then
            :
          elif [[ "${base_tag}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            :
          else
            ver=$(gh api "repos/rafaelgaspar/xpra-html5/contents/setup.py?ref=rafaelgaspar" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null \
              | sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' | head -1)
            short="${html5_tag#v}"
            short="${short%%-rafaelgaspar.*}"
            short="${short#*-}"
            short="${short:0:7}"
            [[ -n "${ver}" && -n "${short}" ]] && base_tag="v${ver}-${short}" || base_tag="${base_tag}"
          fi
          cd xpra-html5-src
          html5_version="${html5_tag#v}"
          asset="xpra-html5-${html5_version}.tar.gz"
          mkdir -p ../dist
          curl -fsSL -o "../dist/${asset}" \
            "https://github.com/rafaelgaspar/xpra-html5/releases/download/${html5_tag}/${asset}"
          echo "base_tag=${base_tag}" >> "$GITHUB_OUTPUT"
          echo "html5_tag=${html5_tag}" >> "$GITHUB_OUTPUT"
          echo "html5_version=${html5_version}" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/${asset}" >> "$GITHUB_OUTPUT"

      # resolve-integration-tag.sh skips commits that already have a tag, but the
      # deb also bundles the xpra-html5 client: publish the next build number when
      # the newest release of this commit bundles a different xpra-html5 tag.
      - name: Check the bundled xpra-html5 release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SKIP_RELEASE: ${{ steps.release.outputs.skip_release }}
          BASE_TAG: ${{ steps.release.outputs.base_tag }}
          HTML5_TAG: ${{ steps.html5.outputs.html5_tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          skip="${SKIP_RELEASE}"
          if [[ "${skip}" == "true" ]]; then
            tag=$(git tag -l "${BASE_TAG}-rafaelgaspar.*" --points-at HEAD | sort -V | tail -1)
            body=$(gh release view "${tag}" --repo rafaelgaspar/xpra --json body -q .body) || body=""
            bundled=$(grep -oE 'xpra-html5 @ v[^ )]+' <<<"${body}" | head -1 | sed 's/^xpra-html5 @ //') || bundled=""
            release_ok=true
            if ! gh release view "${tag}" --repo rafaelgaspar/xpra >/dev/null 2>&1; then
              release_ok=false
            fi
            if [[ "${bundled}" != "${HTML5_TAG}" ]] || [[ "${release_ok}" != "true" ]]; then
              ver="${BASE_TAG#v}"
              ver="${ver%%-*}"
              max=-1
              while IFS= read -r t; do
                [[ -z $t ]] && continue
                n=${t##*.}
                [[ $n =~ ^[0-9]+$ ]] || continue
                if (( n > max )); then
                  max=$n
                fi
              done < <(git tag -l "v${ver}-*-rafaelgaspar."*)
              tag="${BASE_TAG}-rafaelgaspar.$((max + 1))"
              skip=false
              if [[ "${release_ok}" != "true" ]]; then
                echo "${tag}: integration tag exists but GitHub release is missing"
              else
                echo "${tag}: the release of this commit bundles xpra-html5 ${bundled:-(unknown)}, not ${HTML5_TAG}"
              fi
            fi
          fi
          {
            echo "tag=${tag}"
            echo "deb_version=${tag#v}"
            echo "skip_release=${skip}"
          } >> "$GITHUB_OUTPUT"

      - name: Map Debian version
        id: debian_ver
        run: |
          set -euo pipefail
          v="${{ steps.decide.outputs.deb_version }}"
          if echo "$v" | grep -qE '^[0-9]+(\.[0-9]+)*-[0-9a-f]+-rafaelgaspar\.[0-9]+$'; then
            deb=$(printf '%s' "$v" | sed -E 's/^([0-9]+(\.[0-9]+)*)-([0-9a-f]+)-rafaelgaspar\.([0-9]+)$/\1~\3.rafaelgaspar.\4/')
            echo "debian_version=${deb}" >> "$GITHUB_OUTPUT"
          else
            echo "error: integration version ${v} is not a v7.x hash-based rafaelgaspar tag" >&2
            exit 1
          fi

      - name: Build full xpra debs (fork stack, debian:forky)
        env:
          FORKY_IMAGE: debian:forky@sha256:49c219ade93d7c11635c0d57e735ed82339a503a4376cd6957046c2bd4e5905b
          DEBIAN_VERSION: ${{ steps.debian_ver.outputs.debian_version }}
          HTML5_TAR: ${{ steps.html5.outputs.tarball }}
        run: |
          set -euo pipefail
          chmod +x ./packaging/debian/build-rafaelgaspar-xpra-for-forky.sh
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e RAFAELGASPAR_DEBIAN_SUITE=forky \
            -e DEBIAN_VERSION \
            -e HTML5_TAR \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            "${FORKY_IMAGE}" \
            bash -euxo pipefail -c '
              if [[ -f /etc/apt/sources.list.d/debian.sources ]]; then
                sed -i "s/Components: main/Components: main contrib non-free non-free-firmware/" \
                  /etc/apt/sources.list.d/debian.sources
              fi
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential debhelper devscripts dh-python dpkg-dev equivs fakeroot \
                lsb-release python3-all python3-dev python3-pip python3-setuptools quilt \
                ca-certificates
              ./packaging/debian/build-rafaelgaspar-xpra-for-forky.sh "${DEBIAN_VERSION}" "${HTML5_TAR}"
            '

      - name: Publish apt repo to GitHub Pages
        if: steps.decide.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APT_PAGES_COMMIT_LABEL: ${{ steps.decide.outputs.tag }}
          APT_LABEL: rafaelgaspar xpra
          APT_DESCRIPTION: rafaelgaspar/xpra integration debs for Debian forky
          APT_GPG_ASC_FILENAME: rafaelgaspar-xpra.gpg.asc
          APT_ARCHITECTURES: amd64
          APT_PAGES_README: |
            # rafaelgaspar/xpra
            # Apt: https://rafaelgaspar.github.io/xpra/apt
          FORKY_IMAGE: debian:forky@sha256:49c219ade93d7c11635c0d57e735ed82339a503a4376cd6957046c2bd4e5905b
          APT_SIGN_KEY_ID: ${{ vars.APT_SIGN_KEY_ID }}
          APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
          APT_REPO_GPG_PUBLIC_ARMOR: ${{ secrets.APT_REPO_GPG_PUBLIC_ARMOR }}
          RAFAELGASPAR_FORK_PACK: ${{ github.workspace }}/.fork-pack
        run: |
          set -euo pipefail
          chmod +x .fork-pack/scripts/debian/publish-apt-to-github-pages.sh
          .fork-pack/scripts/debian/publish-apt-to-github-pages.sh dist/debian

      - name: Create and push integration tag
        if: steps.decide.outputs.skip_release != 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git tag -a "${TAG}" -m "rafaelgaspar integration release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: steps.decide.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          rafaelgaspar integration release based on upstream ${{ steps.release.outputs.base_tag }}.

          Full Debian packages built from this tree on **debian:forky**.

          - \`deb-manifest.txt\` + per-package \`.deb\` assets (manual install)
          - **Apt:** \`deb [signed-by=/usr/share/keyrings/rafaelgaspar-xpra.gpg] https://rafaelgaspar.github.io/xpra/apt forky main\`
            (key: https://rafaelgaspar.github.io/xpra/apt/rafaelgaspar-xpra.gpg.asc when signing is enabled)

          HTML5 www tree staged from xpra-html5 @ ${{ steps.html5.outputs.html5_tag }}.
          Client tarball: [rafaelgaspar/xpra-html5](https://github.com/rafaelgaspar/xpra-html5/releases/tag/${{ steps.html5.outputs.html5_tag }})
          EOF
          )
          mapfile -t assets < <(find dist/debian -maxdepth 1 -name '*.deb' ! -name 'xpra-build-deps_*' -type f | sort)
          if [ -f dist/debian/deb-manifest.txt ]; then
            manifest_lines=$(grep -cve '^[[:space:]]*$' dist/debian/deb-manifest.txt || true)
            if [ "${manifest_lines}" -eq 0 ]; then
              echo "deb-manifest.txt is empty" >&2
              exit 1
            fi
            assets+=(dist/debian/deb-manifest.txt)
          fi
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no release assets built" >&2
            exit 1
          fi
          gh release create "${TAG}" \
            --repo rafaelgaspar/xpra \
            --title "${TAG}" \
            --notes "${body}" \
            --target rafaelgaspar \
            "${assets[@]}"
