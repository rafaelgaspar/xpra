name: rafaelgaspar Release

on:
  push:
    branches:
      - rafaelgaspar
  # Re-publish the overlay after an xpra-html5 release: the deb bundles the
  # HTML5 client, so a new client needs a new overlay even when xpra did not change.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to publish (branch tip after tag-bump)
        type: string
        required: false
        default: rafaelgaspar
      upstream_tag:
        description: Upstream tag the stack was rebuilt onto
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  release:
    name: Tag, build deb, publish release
    if: github.repository == 'rafaelgaspar/xpra'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Caller event_name is schedule/workflow_dispatch, not workflow_call.
          ref: ${{ inputs.ref || github.sha }}

      - name: Configure git
        run: |
          git config user.name "Rafael Antunes"
          git config user.email "me@rafaelgaspar.xyz"

      - name: Fetch upstream tags
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Xpra-org/xpra.git
          else
            git remote add upstream https://github.com/Xpra-org/xpra.git
          fi
          git fetch --tags upstream

      - name: Resolve integration tag
        id: release
        env:
          UPSTREAM_TAG_INPUT: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          integration_base="${UPSTREAM_TAG_INPUT}"
          if [[ -z "${integration_base}" ]]; then
            git fetch --depth=1 upstream v7.x:v7.x
            merge=$(git merge-base HEAD upstream/v7.x)
            short=$(git rev-parse --short=7 "${merge}")
            ver=$(git show "${merge}:xpra/__init__.py" | sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' | head -1)
            integration_base="v${ver}-${short}"
          fi
          chmod +x ./.github/scripts/resolve-integration-tag.sh
          ./.github/scripts/resolve-integration-tag.sh 'v*.*.*' '^v[0-9]+\.[0-9]+\.[0-9]+$' "${integration_base}"
          integration_version=$(grep '^integration_version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          base_tag=$(grep '^base_tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          pkg_ver=$(grep '^package_upstream_version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          echo "deb_version=${integration_version}" >> "$GITHUB_OUTPUT"
          echo "xpra_upstream_version=${pkg_ver:-${base_tag#v}}" >> "$GITHUB_OUTPUT"

      - name: Checkout xpra-html5 fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rafaelgaspar/xpra-html5
          ref: rafaelgaspar
          path: xpra-html5-src
          fetch-depth: 0

      - name: Download xpra-html5 release tarball for overlay deb
        id: html5
        run: |
          set -euo pipefail
          cd xpra-html5-src
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Xpra-org/xpra-html5.git
          else
            git remote add upstream https://github.com/Xpra-org/xpra-html5.git
          fi
          git fetch --tags upstream
          base_tag=$(git tag -l 'v[0-9]*' --merged HEAD | grep -E '^v[0-9]+$' | sort -V | tail -1)
          [[ -n "${base_tag}" ]] || { echo "No upstream html5 base tag found"; exit 1; }
          # Branch-line html5 tags (v21-{shortsha}-rafaelgaspar.N) do not match v21-rafaelgaspar*.
          html5_tag=$(git tag -l '*-rafaelgaspar.*' --points-at HEAD | sort -V | tail -1)
          if [[ -z "${html5_tag}" ]]; then
            html5_tag=$(git tag -l "${base_tag}-rafaelgaspar*" --points-at HEAD | sort -V | tail -1)
          fi
          [[ -n "${html5_tag}" ]] || { echo "No rafaelgaspar integration tag on xpra-html5 HEAD; release xpra-html5 first"; exit 1; }
          html5_version="${html5_tag#v}"
          asset="xpra-html5-${html5_version}.tar.gz"
          mkdir -p ../dist
          curl -fsSL -o "../dist/${asset}" \
            "https://github.com/rafaelgaspar/xpra-html5/releases/download/${html5_tag}/${asset}"
          echo "base_tag=${base_tag}" >> "$GITHUB_OUTPUT"
          echo "html5_tag=${html5_tag}" >> "$GITHUB_OUTPUT"
          echo "html5_version=${html5_version}" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/${asset}" >> "$GITHUB_OUTPUT"

      # resolve-integration-tag.sh skips commits that already have a tag, but the
      # deb also bundles the xpra-html5 client: publish the next build number when
      # the newest release of this commit bundles a different xpra-html5 tag.
      - name: Check the bundled xpra-html5 release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SKIP_RELEASE: ${{ steps.release.outputs.skip_release }}
          BASE_TAG: ${{ steps.release.outputs.base_tag }}
          HTML5_TAG: ${{ steps.html5.outputs.html5_tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          skip="${SKIP_RELEASE}"
          if [[ "${skip}" == "true" ]]; then
            tag=$(git tag -l "${BASE_TAG}-rafaelgaspar.*" --points-at HEAD | sort -V | tail -1)
            body=$(gh release view "${tag}" --repo rafaelgaspar/xpra --json body -q .body) || body=""
            bundled=$(grep -oE 'xpra-html5 @ v[^ )]+' <<<"${body}" | head -1 | sed 's/^xpra-html5 @ //') || bundled=""
            if [[ "${bundled}" != "${HTML5_TAG}" ]]; then
              latest=$(git tag -l "${BASE_TAG}-rafaelgaspar.*" | sort -V | tail -1)
              tag="${BASE_TAG}-rafaelgaspar.$((${latest##*.} + 1))"
              skip=false
              echo "${tag}: the release of this commit bundles xpra-html5 ${bundled:-(unknown)}, not ${HTML5_TAG}"
            fi
          fi
          {
            echo "tag=${tag}"
            echo "deb_version=${tag#v}"
            echo "skip_release=${skip}"
          } >> "$GITHUB_OUTPUT"

      - name: Map Debian version (full fork deb integrations)
        id: debian_ver
        run: |
          set -euo pipefail
          v="${{ steps.decide.outputs.deb_version }}"
          if echo "$v" | grep -q '-main-'; then
            deb=$(printf '%s' "$v" | sed -E 's/^([0-9]+(\.[0-9]+)*)-main-([0-9a-f]+)-rafaelgaspar\.([0-9]+)$/\1~main+\3.rafaelgaspar.\4/')
            echo "debian_version=${deb}" >> "$GITHUB_OUTPUT"
            echo "build_full=true" >> "$GITHUB_OUTPUT"
          elif echo "$v" | grep -qE '^[0-9]+(\.[0-9]+)*-[0-9a-f]+-rafaelgaspar\.[0-9]+$'; then
            deb=$(printf '%s' "$v" | sed -E 's/^([0-9]+(\.[0-9]+)*)-([0-9a-f]+)-rafaelgaspar\.([0-9]+)$/\1~\3.rafaelgaspar.\4/')
            echo "debian_version=${deb}" >> "$GITHUB_OUTPUT"
            echo "build_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build overlay deb
        if: steps.debian_ver.outputs.build_full != 'true'
        run: |
          chmod +x ./packaging/rafaelgaspar-overlay/build-deb.sh
          ./packaging/rafaelgaspar-overlay/build-deb.sh \
            "${{ steps.decide.outputs.deb_version }}" \
            "${{ steps.release.outputs.xpra_upstream_version }}" \
            "${{ steps.html5.outputs.tarball }}" \
            "${{ steps.html5.outputs.base_tag }}"

      - name: Install Debian package build toolchain
        if: steps.debian_ver.outputs.build_full == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts dh-python dpkg-dev fakeroot \
            python3-all python3-dev python3-pip python3-setuptools quilt

      - name: Build full xpra debs (fork stack)
        if: steps.debian_ver.outputs.build_full == 'true'
        run: |
          set -euo pipefail
          chmod +x ./packaging/debian/build-rafaelgaspar-from-git.sh
          ./packaging/debian/build-rafaelgaspar-from-git.sh \
            "${{ steps.debian_ver.outputs.debian_version }}" \
            "${{ steps.html5.outputs.tarball }}"

      - name: Create and push integration tag
        if: steps.decide.outputs.skip_release != 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git tag -a "${TAG}" -m "rafaelgaspar integration release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: steps.decide.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
          DEB: dist/xpra-rafaelgaspar-overlay_${{ steps.decide.outputs.deb_version }}_all.deb
        run: |
          body=$(cat <<EOF
          rafaelgaspar integration release based on upstream ${{ steps.release.outputs.base_tag }}.

          - \`xpra-rafaelgaspar-overlay\` Debian package (dpkg-divert; Python patches + HTML5 www tree from rafaelgaspar/xpra-html5 @ ${{ steps.html5.outputs.html5_tag }})
          - HTML5 client tarball is published only on [rafaelgaspar/xpra-html5](https://github.com/rafaelgaspar/xpra-html5/releases/tag/${{ steps.html5.outputs.html5_tag }})
          EOF
          )
          assets=()
          if [ -f "${DEB}" ]; then
            assets+=("${DEB}")
          fi
          if [ -f dist/debian/deb-manifest.txt ]; then
            assets+=(dist/debian/*.deb)
            assets+=(dist/debian/deb-manifest.txt)
          fi
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no release assets built" >&2
            exit 1
          fi
          gh release create "${TAG}" \
            --repo rafaelgaspar/xpra \
            --title "${TAG}" \
            --notes "${body}" \
            --target rafaelgaspar \
            "${assets[@]}"
