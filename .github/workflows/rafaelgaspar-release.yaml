name: rafaelgaspar Release

on:
  push:
    branches:
      - rafaelgaspar

permissions: {}

jobs:
  release:
    name: Tag, build deb, publish release
    if: github.repository == 'rafaelgaspar/xpra'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Rafael Antunes"
          git config user.email "me@rafaelgaspar.xyz"

      - name: Fetch upstream tags
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Xpra-org/xpra.git
          else
            git remote add upstream https://github.com/Xpra-org/xpra.git
          fi
          git fetch --tags upstream

      - name: Resolve integration tag
        id: release
        run: |
          set -euo pipefail
          base_tag=$(git tag -l 'v*.*.*' --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [[ -n "${base_tag}" ]] || { echo "No upstream semver tag found in history"; exit 1; }
          version="${base_tag#v}"
          prefix="${base_tag}-rafaelgaspar"
          build=0
          while git rev-parse "${prefix}" >/dev/null 2>&1; do
            existing=$(git rev-parse "${prefix}")
            if [[ "${existing}" == "${GITHUB_SHA}" ]]; then
              echo "tag=${prefix}" >> "$GITHUB_OUTPUT"
              echo "deb_version=${version}.${build}" >> "$GITHUB_OUTPUT"
              echo "xpra_upstream_version=${version}" >> "$GITHUB_OUTPUT"
              echo "skip_release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            build=$((build + 1))
            prefix="${base_tag}-rafaelgaspar.${build}"
          done
          echo "tag=${prefix}" >> "$GITHUB_OUTPUT"
          echo "deb_version=${version}.${build}" >> "$GITHUB_OUTPUT"
          echo "xpra_upstream_version=${version}" >> "$GITHUB_OUTPUT"
          echo "base_tag=${base_tag}" >> "$GITHUB_OUTPUT"
          echo "skip_release=false" >> "$GITHUB_OUTPUT"

      - name: Checkout xpra-html5 fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rafaelgaspar/xpra-html5
          ref: rafaelgaspar
          path: xpra-html5-src
          fetch-depth: 0

      - name: Build xpra-html5 tarball from source
        id: html5
        run: |
          set -euo pipefail
          cd xpra-html5-src
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Xpra-org/xpra-html5.git
          else
            git remote add upstream https://github.com/Xpra-org/xpra-html5.git
          fi
          git fetch --tags upstream
          base_tag=$(git tag -l 'v[0-9]*' --merged HEAD | grep -E '^v[0-9]+$' | sort -V | tail -1)
          [[ -n "${base_tag}" ]] || { echo "No upstream html5 base tag found"; exit 1; }
          html5_version=$(git tag -l "${base_tag}-rafaelgaspar*" --points-at HEAD | sort -V | tail -1)
          [[ -n "${html5_version}" ]] || { echo "No rafaelgaspar integration tag on xpra-html5 HEAD"; exit 1; }
          html5_version="${html5_version#v}"
          for f in Menu.js MenuCustom.js Client.js Window.js; do
            node --check "html5/js/${f}"
          done
          staging="$(mktemp -d)"
          mkdir -p "${staging}/xpra-html5-${html5_version}/html5"
          cp -a html5/. "${staging}/xpra-html5-${html5_version}/html5/"
          mkdir -p ../dist
          asset="xpra-html5-${html5_version}.tar.gz"
          tar -czf "../dist/${asset}" -C "${staging}" "xpra-html5-${html5_version}"
          rm -rf "${staging}"
          echo "base_tag=${base_tag}" >> "$GITHUB_OUTPUT"
          echo "html5_version=${html5_version}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/${asset}" >> "$GITHUB_OUTPUT"

      - name: Build overlay deb
        run: |
          chmod +x ./packaging/rafaelgaspar-overlay/build-deb.sh
          ./packaging/rafaelgaspar-overlay/build-deb.sh \
            "${{ steps.release.outputs.deb_version }}" \
            "${{ steps.release.outputs.xpra_upstream_version }}" \
            "${{ steps.html5.outputs.tarball }}" \
            "${{ steps.html5.outputs.base_tag }}"

      - name: Create and push integration tag
        if: steps.release.outputs.skip_release != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag -a "${TAG}" -m "rafaelgaspar integration release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: steps.release.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DEB: dist/xpra-rafaelgaspar-overlay_${{ steps.release.outputs.deb_version }}_all.deb
          HTML5: dist/${{ steps.html5.outputs.asset }}
        run: |
          body=$(cat <<EOF
          rafaelgaspar integration release based on upstream ${{ steps.release.outputs.base_tag }}.

          - \`xpra-rafaelgaspar-overlay\` Debian package (dpkg-divert + version-pinned replaces; Python patches + fork HTML5 www tree)
          - Bundled HTML5 client built from rafaelgaspar/xpra-html5 @ ${{ steps.html5.outputs.base_tag }}
          EOF
          )
          gh release create "${TAG}" \
            --repo rafaelgaspar/xpra \
            --title "${TAG}" \
            --notes "${body}" \
            --target rafaelgaspar \
            "${DEB}" \
            "${HTML5}"
